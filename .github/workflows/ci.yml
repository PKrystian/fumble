name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci

      - name: Dependency audit
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > fumble-sbom.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: fumble-sbom.cdx.json
          retention-days: 30

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: unit-coverage
          path: coverage/unit/coverage-final.json
          retention-days: 1

      - name: Build
        run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v8
        with:
          name: unit-coverage
          path: coverage/unit

      - name: Run E2E tests with coverage
        run: npm run test:e2e:coverage

      - name: Merge coverage
        run: npm run test:coverage:merge

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/merged/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: e2e
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:pages
        env:
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Cancel stale Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for deployment_sha in $(gh api "repos/${REPOSITORY}/commits?sha=main&per_page=30" --jq '.[].sha'); do
            deployment_status=$(gh api "repos/${REPOSITORY}/pages/deployments/${deployment_sha}" --jq '.status' 2>/dev/null || true)
            if [[ "$deployment_status" == "deployment_queued" || "$deployment_status" == "deployment_in_progress" ]]; then
              echo "Canceling stale Pages deployment ${deployment_sha} (${deployment_status})"
              gh api --method POST "repos/${REPOSITORY}/pages/deployments/${deployment_sha}/cancel" --silent || true
            fi
          done

      - id: deployment
        uses: actions/deploy-pages@v5
